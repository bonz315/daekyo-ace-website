<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - (주)대교에이스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>

<body>
    <!-- 로그인 영역 -->
    <div id="loginSection" class="admin-login-container">
        <div class="login-card">
            <div class="logo" style="margin-bottom: 2rem; justify-content: center;">
                <img src="images/logo.png" alt="대교에이스 로고" style="height: 50px;">
            </div>
            <h2>시스템 관리자 로그인</h2>
            <p>관리자 비밀번호를 입력해주세요.</p>
            <form id="loginForm" style="margin-top: 2rem;">
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; padding: 1rem;">로그인</button>
                <p id="loginError" style="color: #ff4d4d; margin-top: 1rem; display: none;">비밀번호가 일치하지 않습니다.</p>
            </form>
        </div>
    </div>

    <!-- 관리자 대시보드 (로그인 후 표시) -->
    <div id="adminDashboard" style="display: none;">
        <header class="admin-header">
            <div class="admin-container">
                <div style="display: flex; align-items: center; gap: 2rem;">
                    <a href="index.html" class="logo">
                        <img src="images/logo.png" alt="로고" style="height: 35px;">
                    </a>
                    <h1 style="font-size: 1.2rem; color: var(--white); opacity: 0.8;">Admin Dashboard</h1>
                </div>
                <button id="logoutBtn" class="btn-outline" style="color: white; border-color: white;">로그아웃</button>
            </div>
        </header>

        <main class="admin-container" style="padding: 2rem 0;">
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="product">제품 관리</button>
                <button class="admin-tab" data-tab="resource">자료실 관리</button>
                <button class="admin-tab" data-tab="inquiry">문의 관리</button>
            </div>

            <!-- 제품 관리 탭 -->
            <div id="productTab" class="tab-content active">
                <div class="admin-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2>제품 등록/수정</h2>
                        <button class="btn" onclick="openProductModal()">+ 새 제품 등록</button>
                    </div>

                    <div class="admin-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>이미지</th>
                                    <th>제품명</th>
                                    <th>카테고리</th>
                                    <th>등록일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductList">
                                <!-- 제품 리스트가 여기에 렌더링됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 자료실 관리 탭 -->
            <div id="resourceTab" class="tab-content">
                <div class="admin-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2>자료실 파일 등록/수정</h2>
                        <button class="btn" onclick="openResourceModal()">+ 새 자료 등록</button>
                    </div>

                    <div class="admin-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>유형</th>
                                    <th>제목</th>
                                    <th>상세설명</th>
                                    <th>파일경로</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="adminResourceList">
                                <!-- 자료 리스트가 여기에 렌더링됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 문의 관리 탭 (추가) -->
            <div id="inquiryTab" class="tab-content">
                <div class="admin-card">
                    <h2>고객 문의 내역</h2>
                    <div class="admin-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>이름(회사)</th>
                                    <th>제목</th>
                                    <th>상태</th>
                                    <th>접수일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="adminInquiryList">
                                <!-- 문의 리스트 렌더링 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 답변 등록 모달 -->
    <div id="answerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>문의 답변하기</h3>
                <span class="close" onclick="closeAnswerModal()">&times;</span>
            </div>
            <div id="inquiryDetailView"
                style="margin-bottom:2rem; padding:1.5rem; background:#f9f9f9; border-radius:10px;">
                <!-- 문의 상세 정보 -->
            </div>
            <form id="answerForm">
                <input type="hidden" id="answerInqId">
                <div class="form-group">
                    <label>답변 내용 *</label>
                    <textarea id="adminAnswerText" rows="6" required placeholder="고객님께 전달할 답변을 입력하세요."></textarea>
                </div>
                <div style="margin-top:2rem; display:flex; gap:1rem; justify-content:flex-end;">
                    <button type="button" class="btn-outline" onclick="closeAnswerModal()">취소</button>
                    <button type="submit" class="btn">답변 등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 제품 등록 모달 -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">제품 등록</h3>
                <span class="close" onclick="closeProductModal()">&times;</span>
            </div>
            <form id="productForm">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>제품명 *</label>
                        <input type="text" id="prodName" required>
                    </div>
                    <div class="form-group">
                        <label>대분류 *</label>
                        <select id="prodMainCat" required onchange="updateSubSelect()"></select>
                    </div>
                    <div class="form-group">
                        <label>중분류 *</label>
                        <select id="prodSubCat" required></select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>제품 이미지 *</label>
                        <div style="display: flex; gap: 1rem; align-items: flex-start;">
                            <input type="text" id="prodImage" placeholder="images/products/파일명.jpg" style="flex: 1;">
                            <input type="file" id="prodImageFile" style="display: none;"
                                onchange="handleImageSelect(this, 'prodImage', 'imagePreview')">
                            <button type="button" class="btn-outline"
                                onclick="document.getElementById('prodImageFile').click()"
                                style="white-space: nowrap;">파일 첨부</button>
                        </div>
                        <div id="imagePreview" style="margin-top: 10px; max-width: 150px; display: none;">
                            <img src="" style="width: 100%; border-radius: 5px; border: 1px solid #ddd;">
                        </div>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>상세 사양 (규격, 재질 등 - 한 줄씩 입력)</label>
                    <textarea id="prodSpecs" rows="4" placeholder="규격: 100x200&#10;재질: PVC"></textarea>
                </div>
                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn-outline" onclick="closeProductModal()">취소</button>
                    <button type="submit" class="btn">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 자료 등록 모달 -->
    <div id="resourceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="resModalTitle">새 자료 등록</h3>
                <span class="close" onclick="closeResourceModal()">&times;</span>
            </div>
            <form id="resourceForm">
                <input type="hidden" id="editResId">
                <div class="form-grid">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>제목 *</label>
                        <input type="text" id="resTitle" required placeholder="예: 2025 신규 카탈로그">
                    </div>
                    <div class="form-group">
                        <label>유형 *</label>
                        <select id="resType" required>
                            <option value="catalog">카탈로그</option>
                            <option value="tax">국세,지방세</option>
                            <option value="cert">인증서</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>파일 정보</label>
                        <input type="text" id="resInfo" placeholder="예: PDF, 1.5MB | 2025.02.20">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>상세 설명</label>
                        <input type="text" id="resDesc" placeholder="간략한 설명을 입력하세요.">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>표지/썸네일 이미지</label>
                        <div style="display: flex; gap: 1rem; align-items: start;">
                            <div style="flex: 1;">
                                <input type="text" id="resThumb" placeholder="이미지를 업로드하거나 URL을 입력하세요."
                                    style="margin-bottom: 5px;">
                                <input type="file" id="resThumbFile" style="display: none;"
                                    onchange="handleImageSelect(this, 'resThumb', 'resThumbPreview')">
                                <button type="button" class="btn btn-sm btn-outline"
                                    onclick="document.getElementById('resThumbFile').click()">이미지 업로드</button>
                            </div>
                            <div id="resThumbPreview"
                                style="width: 80px; height: 100px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; display: none; background: #f9f9f9;">
                                <img src="" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                        </div>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>파일 경로 *</label>
                        <div style="display: flex; gap: 1rem;">
                            <input type="text" id="resUrl" required placeholder="files/파일명.pdf" style="flex: 1;">
                            <input type="file" id="resFile" style="display: none;"
                                onchange="handleImageSelect(this, 'resUrl')">
                            <button type="button" class="btn-outline"
                                onclick="document.getElementById('resFile').click()" style="white-space: nowrap;">파일
                                첨부</button>
                        </div>
                        <p style="font-size: 0.8rem; color: #999; margin-top: 5px;">* 파일은 자동으로 최적화되어 데이터베이스에 안전하게 저장됩니다.
                        </p>
                    </div>
                </div>
                <div style="margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn-outline" onclick="closeResourceModal()">취소</button>
                    <button type="submit" class="btn">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/products-data.js"></script>
    <script src="js/resources-data.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
